<!DOCTYPE html><html><body><script type="module">
const U='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1';
const M='https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
const t0=performance.now(); const log={};
const v=await import(U+'/vision_bundle.mjs'); log.import=performance.now()-t0;

t=performance.now(); pl.detectForVideo(c,t+1); log.secondDetect=performance.now()-t;

</script></body></html>
