<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="AI 智慧運動分析系統：透過鏡頭即時分析運動姿勢">
    <title>AI 智慧運動分析系統</title>
    <!-- 目前沒有網站圖示；宣告空白圖示，瀏覽器就不會去找 favicon.ico 而產生錯誤 -->
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>AI 智慧運動分析系統</h1>
        <p class="intro">用一支鏡頭，即時看見你的運動姿勢</p>
    </header>

    <main>
        <button id="startBtn">開啟鏡頭</button>
        <!-- aria-live：狀態改變時，螢幕閱讀器會唸出來 -->
        <p id="status" aria-live="polite">尚未開啟鏡頭</p>
        <p id="modelStatus" aria-live="polite">AI 準備中…</p>
        <noscript><p>請開啟瀏覽器的 JavaScript 功能，才能使用本網站。</p></noscript>
        <!-- AI 載入進度條：不顯示百分比，用文字說明目前在做什麼 -->
        <div id="modelProgress" role="progressbar" aria-label="AI 載入進度"><div class="fill"></div></div>
        <p id="modelHint">第一次使用需下載約 18 MB，之後開啟會快很多</p>
    </main>

    <footer>
        <p>&copy; 2026 AI 智慧運動分析系統</p>
    </footer>

    <div id="stage" hidden>
        <!-- playsinline 讓 iPhone 不會自動全螢幕，muted 讓瀏覽器允許自動播放 -->
        <video id="video" autoplay playsinline muted></video>
        <!-- 骨架畫在這張透明畫布上，疊在影像上方 -->
        <canvas id="overlay"></canvas>
        <!-- 關鍵點的編號標籤（網頁文字，比畫在畫布上清楚） -->
        <div id="labels"></div>
        <div id="toolbar">
            <button id="stopBtn">關閉鏡頭</button>
            <!-- 有兩顆以上鏡頭時才顯示 -->
            <select id="cameraSelect" aria-label="選擇鏡頭" title="選擇鏡頭" hidden></select>
            <button id="labelBtn" title="也可以直接點畫面上的點，查看它的編號與名稱">顯示編號</button>
            <button id="dataBtn" title="顯示關鍵點的 x、y、z 數值，並可錄製匯出">數據</button>
            <button id="fullscreenBtn">全螢幕</button>
        </div>
        <div id="infobar">
            <span id="poseStatus">AI 準備中…</span>
            <button id="perfBtn" hidden title="點一下顯示或收合詳細資訊"></button>
        </div>
        <!-- 數據面板：主要關節的原始數值，以及錄製、下載 -->
        <div id="dataPanel" hidden>
            <div class="panel-head">
                <button id="recordBtn">● 開始錄製</button>
                <span id="recordInfo"></span>
                <button id="csvBtn" hidden>下載 CSV</button>
                <button id="jsonBtn" hidden>下載 JSON</button>
            </div>
            <div class="panel-body">
                <table>
                    <thead><tr><th>關節</th><th>x</th><th>y</th><th>z</th><th>可信度</th></tr></thead>
                    <tbody id="dataRows"></tbody>
                </table>
                <p class="panel-note">原始資料（未經平滑）。x、y：在畫面中的位置，0～1，左上角為 0；z：相對深度，以髖部中心為 0，越小越靠近鏡頭；淡色：模型看不到、用猜的點</p>
            </div>
        </div>
    </div>

    <!-- 程式從 js/main.js 開始，各功能分在 js/ 資料夾的不同檔案 -->
    <script type="module" src="js/main.js"></script>
    <!-- 太舊的瀏覽器不支援上面的寫法，改顯示提示，不會只是按了沒反應 -->
    <script nomodule>
        document.getElementById('status').textContent = '此瀏覽器版本太舊，請改用新版 Chrome、Safari 或 Edge';
        document.getElementById('startBtn').disabled = true;
    </script>
</body>
</html>
