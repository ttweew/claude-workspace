<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="AI 智慧運動分析系統：透過鏡頭即時分析運動姿勢">
    <title>AI 智慧運動分析系統</title>
    <style>
        /* 全站字型：優先用各系統內建的無襯線中文字型 */
        body {
            margin: 0 auto;
            max-width: 640px;
            min-height: 100vh;
            min-height: 100dvh;
            box-sizing: border-box;
            padding: 48px 20px 24px;
            display: flex;
            flex-direction: column;
            background: #F5F6F2;
            color: #1B2536;
            font-family: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            line-height: 1.5;
        }
        /* 首頁 */
        h1 {
            margin: 0 0 8px;
            font-size: clamp(26px, 7vw, 40px);
            color: #15233F;
        }
        .intro {
            margin: 0 0 32px;
            color: #45505F;
        }
        /* 開啟鏡頭：大按鈕，手機上用手指也好按 */
        #startBtn {
            width: 100%;
            max-width: 360px;
            min-height: 52px;
            border: none;
            border-radius: 12px;
            background: #15233F;
            color: #FFFFFF;
            font: inherit;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
        }
        #startBtn:disabled {
            opacity: 0.5;
            cursor: default;
        }
        #status {
            color: #6B7585;
            font-size: 15px;
        }
        footer {
            margin-top: auto;
            padding-top: 24px;
            color: #6B7585;
            font-size: 13px;
        }
        /* 鏡頭開啟後，畫面佔滿整個瀏覽器視窗 */
        #stage {
            position: fixed;
            inset: 0;
            background: #000;
        }
        /* contain：完整顯示整個畫面、不裁切，才看得到全身
           骨架畫布與影像用相同設定，兩者會完全重疊 */
        #video, #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #overlay {
            pointer-events: none;
        }
        /* 只翻轉畫面顯示，不影響鏡頭原始資料，後續 AI 分析的左右仍正確 */
        .mirrored {
            transform: scaleX(-1);
        }
        /* 疊在畫面上方的控制列：只放按鈕，手機上也維持一行
           env(safe-area-inset-*)：避開 iPhone 瀏海與圓角 */
        #toolbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) 8px max(8px, env(safe-area-inset-left));
            background: rgba(0, 0, 0, 0.55);
            font-size: 14px;
        }
        #toolbar button, #toolbar select {
            min-height: 36px;
            padding: 0 12px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.15);
            color: #FFFFFF;
            font: inherit;
            white-space: nowrap;
            cursor: pointer;
        }
        /* 下拉選單佔剩下的寬度；字級 16px 以上，iPhone 點選時才不會自動放大畫面 */
        #toolbar select {
            flex: 1;
            min-width: 0;
            max-width: 320px;
            font-size: 16px;
            text-overflow: ellipsis;
        }
        #toolbar select option {
            color: #1B2536;
        }
        /* 狀態小標籤：浮在控制列下方，不佔整條寬度，也不會擋住腳的位置 */
        #infobar {
            position: absolute;
            top: calc(max(8px, env(safe-area-inset-top)) + 60px);
            left: max(8px, env(safe-area-inset-left));
            right: max(8px, env(safe-area-inset-right));
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 14px;
            pointer-events: none;
        }
        #infobar > * {
            padding: 4px 12px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 999px;
            background: rgba(21, 35, 63, 0.8);
            color: #FFFFFF;
            pointer-events: auto;
        }
        /* 運算方式與 FPS：點一下可展開或收合詳細資訊 */
        #perfBtn {
            font: inherit;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>AI 智慧運動分析系統</h1>
        <p class="intro">用一支鏡頭，即時看見你的運動姿勢</p>
    </header>

    <main>
        <button id="startBtn">開啟鏡頭</button>
        <p id="status">尚未開啟鏡頭</p>
    </main>

    <footer>
        <p>&copy; 2026 AI 智慧運動分析系統</p>
    </footer>

    <div id="stage" hidden>
        <!-- playsinline 讓 iPhone 不會自動全螢幕，muted 讓瀏覽器允許自動播放 -->
        <video id="video" autoplay playsinline muted></video>
        <!-- 骨架畫在這張透明畫布上，疊在影像上方 -->
        <canvas id="overlay"></canvas>
        <div id="toolbar">
            <button id="stopBtn">關閉鏡頭</button>
            <select id="cameraSelect" aria-label="選擇鏡頭" title="選擇鏡頭"></select>
            <button id="labelBtn">顯示編號</button>
            <button id="fullscreenBtn">全螢幕</button>
        </div>
        <div id="infobar">
            <span id="poseStatus">骨架模型載入中…</span>
            <button id="perfBtn" hidden title="點一下顯示或收合詳細資訊"></button>
        </div>
    </div>

    <script type="module">
        // MediaPipe 版本與骨架模型（lite：最輕量、手機也跑得動）
        const MEDIAPIPE_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1';
        const POSE_MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';

        // MediaPipe 33 個關鍵點的名稱對照表
        // 編號（陣列位置）由模型訓練時固定，不能更改；我們替每個編號取英文代號與中文名稱
        // 左、右指的是被拍攝者本人的左右
        const LANDMARKS = [
            ['NOSE', '鼻子'],                          // 0
            ['LEFT_EYE_INNER', '左眼內側'],            // 1
            ['LEFT_EYE', '左眼'],                      // 2
            ['LEFT_EYE_OUTER', '左眼外側'],            // 3
            ['RIGHT_EYE_INNER', '右眼內側'],           // 4
            ['RIGHT_EYE', '右眼'],                     // 5
            ['RIGHT_EYE_OUTER', '右眼外側'],           // 6
            ['LEFT_EAR', '左耳'],                      // 7
            ['RIGHT_EAR', '右耳'],                     // 8
            ['MOUTH_LEFT', '嘴巴左側'],                // 9
            ['MOUTH_RIGHT', '嘴巴右側'],               // 10
            ['LEFT_SHOULDER', '左肩'],                 // 11
            ['RIGHT_SHOULDER', '右肩'],                // 12
            ['LEFT_ELBOW', '左肘'],                    // 13
            ['RIGHT_ELBOW', '右肘'],                   // 14
            ['LEFT_WRIST', '左腕'],                    // 15
            ['RIGHT_WRIST', '右腕'],                   // 16
            ['LEFT_PINKY', '左手小指'],                // 17
            ['RIGHT_PINKY', '右手小指'],               // 18
            ['LEFT_INDEX', '左手食指'],                // 19
            ['RIGHT_INDEX', '右手食指'],               // 20
            ['LEFT_THUMB', '左手拇指'],                // 21
            ['RIGHT_THUMB', '右手拇指'],               // 22
            ['LEFT_HIP', '左髖'],                      // 23
            ['RIGHT_HIP', '右髖'],                     // 24
            ['LEFT_KNEE', '左膝'],                     // 25
            ['RIGHT_KNEE', '右膝'],                    // 26
            ['LEFT_ANKLE', '左踝'],                    // 27
            ['RIGHT_ANKLE', '右踝'],                   // 28
            ['LEFT_HEEL', '左腳跟'],                   // 29
            ['RIGHT_HEEL', '右腳跟'],                  // 30
            ['LEFT_FOOT_INDEX', '左腳尖'],             // 31
            ['RIGHT_FOOT_INDEX', '右腳尖']             // 32
        ];
        // 用代號查編號，例如 P.LEFT_KNEE 就是 25
        const P = Object.fromEntries(LANDMARKS.map(([key], id) => [key, id]));

        // 兩點的中點：用來算出模型沒有提供的新點
        function midpoint(a, b) {
            return {
                x: (a.x + b.x) / 2,
                y: (a.y + b.y) / 2,
                z: (a.z + b.z) / 2,
                visibility: Math.min(a.visibility, b.visibility)
            };
        }

        // 自己算出的點：髖部中心（重心附近）與肩膀中心，兩點連線就是軀幹
        function getDerivedPoints(landmarks) {
            return {
                HIP_CENTER: midpoint(landmarks[P.LEFT_HIP], landmarks[P.RIGHT_HIP]),
                SHOULDER_CENTER: midpoint(landmarks[P.LEFT_SHOULDER], landmarks[P.RIGHT_SHOULDER])
            };
        }

        const stage = document.getElementById('stage');
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const labelBtn = document.getElementById('labelBtn');
        const cameraSelect = document.getElementById('cameraSelect');
        const statusText = document.getElementById('status');
        const overlay = document.getElementById('overlay');
        const ctx = overlay.getContext('2d');
        const poseStatus = document.getElementById('poseStatus');
        const perfBtn = document.getElementById('perfBtn');

        // 測試用：網址加上 ?cpu 會強制用 CPU，方便同一台裝置比較 GPU 與 CPU 的速度
        const FORCE_CPU = new URLSearchParams(location.search).has('cpu');
        // 是否在每個點旁邊標出編號與名稱：由「顯示編號」按鈕切換；網址加上 ?debug 則一打開就是顯示狀態
        let showLabels = new URLSearchParams(location.search).has('debug');

        let currentStream = null;
        let vision = null;          // MediaPipe 函式庫
        let poseLandmarker = null;  // 骨架偵測器
        let drawingUtils = null;    // MediaPipe 內建的畫骨架工具
        let lastVideoTime = -1;
        let animationId = null;
        let computeMode = '';       // 'GPU' 或 'CPU'
        let computeDetail = '';     // GPU 時為晶片名稱，CPU 時為原因
        let perfExpanded = false;   // 標籤是否展開顯示詳細資訊
        let fpsCount = 0;           // 這一秒內完成的偵測次數
        let fpsStart = 0;
        let fps = 0;

        // 載入 MediaPipe 與骨架模型；失敗時鏡頭仍可正常使用
        async function loadPoseModel() {
            try {
                vision = await import(MEDIAPIPE_URL + '/vision_bundle.mjs');
                const fileset = await vision.FilesetResolver.forVisionTasks(MEDIAPIPE_URL + '/wasm');
                // 優先用 GPU（圖形處理器，手機與電腦的晶片都有內建）加速，不支援時改用 CPU
                const gpu = getGpuInfo();
                if (gpu) perfBtn.title = '瀏覽器回報的 GPU：' + gpu.name;
                if (FORCE_CPU) {
                    poseLandmarker = await createPoseLandmarker(fileset, 'CPU');
                    setCompute('CPU', '測試模式');
                } else if (!gpu || gpu.software) {
                    // 沒有實體 GPU（例如軟體模擬）時，直接用 CPU 反而比較快
                    poseLandmarker = await createPoseLandmarker(fileset, 'CPU');
                    setCompute('CPU', '未偵測到可用的 GPU');
                } else {
                    try {
                        poseLandmarker = await createPoseLandmarker(fileset, 'GPU');
                        setCompute('GPU', shortGpuName(gpu.name));
                    } catch (gpuErr) {
                        console.warn('GPU 無法使用，改用 CPU：', gpuErr);
                        poseLandmarker = await createPoseLandmarker(fileset, 'CPU');
                        setCompute('CPU', '此裝置無法使用 GPU');
                    }
                }
                drawingUtils = new vision.DrawingUtils(ctx);
                poseStatus.textContent = '骨架模型已就緒';
                updatePerfInfo();
            } catch (err) {
                console.error(err);
                poseStatus.textContent = '骨架模型載入失敗（鏡頭仍可使用）';
            }
        }

        // 向瀏覽器查詢 GPU 名稱；software 為 true 代表只是軟體模擬的 GPU（實際仍由 CPU 運算）
        function getGpuInfo() {
            const gl = document.createElement('canvas').getContext('webgl2')
                || document.createElement('canvas').getContext('webgl');
            if (!gl) return null;
            const ext = gl.getExtension('WEBGL_debug_renderer_info');
            const name = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
            return { name: name, software: /swiftshader|llvmpipe|software/i.test(name) };
        }

        // 瀏覽器回報的名稱常包含驅動資訊，只留下一般人看得懂的晶片名稱
        // 例：ANGLE (Intel, Intel(R) UHD Graphics (0x00004688) Direct3D11 vs_5_0 ps_5_0, D3D11) → Intel UHD Graphics
        function shortGpuName(raw) {
            let name = raw;
            const angle = name.match(/^ANGLE \((.*)\)$/);
            if (angle) {
                const parts = angle[1].split(', ');
                name = parts[1] || parts[0];
            }
            name = name
                .replace('ANGLE Metal Renderer: ', '')
                .replace(/\(0x[0-9a-f]+\)/gi, '')
                .replace(/Direct3D.*$/i, '')
                .replace(/\((R|TM)\)/gi, '')
                .replace(/\s+/g, ' ')
                .trim();
            return name || raw;
        }

        function setCompute(mode, detail) {
            computeMode = mode;
            computeDetail = detail;
        }

        // 控制列的小標籤：平常只顯示「GPU · 30 FPS」，點一下展開成「GPU：晶片名稱 · 30 FPS」
        function updatePerfInfo() {
            if (!computeMode) return;
            const parts = [perfExpanded ? computeMode + '：' + computeDetail : computeMode];
            if (currentStream) parts.push(fps ? fps + ' FPS' : 'FPS 計算中');
            perfBtn.textContent = parts.join(' · ');
            perfBtn.hidden = false;
        }

        // 在每個點旁邊標上編號與名稱
        // 主要關節（肩、肘、腕、髖、膝、踝）標「編號＋名稱」；臉、手指、腳跟腳尖的點很密集，只標編號
        function drawLabels(landmarks, derived) {
            const w = overlay.width;
            const h = overlay.height;
            const mirrored = overlay.classList.contains('mirrored');
            // 文字在螢幕上固定約 12～18px：依畫面縮放比例換算，手機直式畫面的字才不會太大
            const scale = Math.min(stage.clientWidth / w, stage.clientHeight / h);
            const screenPx = Math.max(12, Math.min(18, Math.min(stage.clientWidth, stage.clientHeight) / 40));
            const size = Math.round(screenPx / scale);
            ctx.save();
            // 畫布是鏡像顯示時，文字先反向翻一次，顯示出來才不會變成鏡像字
            if (mirrored) {
                ctx.translate(w, 0);
                ctx.scale(-1, 1);
            }
            ctx.textBaseline = 'middle';
            ctx.strokeStyle = '#000000';
            // outward：被拍攝者左側的點往一邊標、右側的點往另一邊標，文字才不會壓在身體上
            //         outward 為 0 時，文字置中標在點的正下方
            //         文字超出畫面邊緣時，往內移回畫面裡
            ctx.textAlign = 'left';
            function label(point, text, color, outward, fontSize) {
                const x = (mirrored ? 1 - point.x : point.x) * w;
                const dir = mirrored ? -outward : outward;
                ctx.font = 'bold ' + fontSize + 'px system-ui, sans-serif';
                ctx.lineWidth = Math.max(2, fontSize / 5);
                ctx.fillStyle = color;
                const width = ctx.measureText(text).width;
                const gap = fontSize * 0.6;
                let left = dir > 0 ? x + gap : dir < 0 ? x - gap - width : x - width / 2;
                left = Math.min(Math.max(left, 2), w - width - 2);
                const ty = point.y * h + (dir === 0 ? fontSize * 1.1 : 0);
                ctx.strokeText(text, left, ty);
                ctx.fillText(text, left, ty);
            }
            // 先畫只有編號的小標籤，最後畫主要關節，名稱才不會被蓋住
            const isMainJoint = id => (id >= 11 && id <= 16) || (id >= 23 && id <= 28);
            LANDMARKS.forEach(([key], id) => {
                if (isMainJoint(id)) return;
                label(landmarks[id], String(id), '#FFFF66', key.includes('RIGHT') ? -1 : 1, Math.round(size * 0.75));
            });
            LANDMARKS.forEach(([key, name], id) => {
                if (!isMainJoint(id)) return;
                label(landmarks[id], id + ' ' + name, '#FFFFFF', key.includes('RIGHT') ? -1 : 1, size);
            });
            label(derived.SHOULDER_CENTER, '肩膀中心', '#8FD3FF', 0, size);
            label(derived.HIP_CENTER, '髖部中心', '#8FD3FF', 0, size);
            ctx.restore();
        }

        function createPoseLandmarker(fileset, delegate) {
            return vision.PoseLandmarker.createFromOptions(fileset, {
                baseOptions: { modelAssetPath: POSE_MODEL_URL, delegate: delegate },
                runningMode: 'VIDEO',
                numPoses: 1
            });
        }

        // 每一個畫面都做一次骨架偵測，並把 33 個關鍵點與連線畫出來
        function detectPose() {
            if (!currentStream) return;
            if (poseLandmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                // 畫布大小跟鏡頭原始解析度一致，座標才會對齊
                if (overlay.width !== video.videoWidth || overlay.height !== video.videoHeight) {
                    overlay.width = video.videoWidth;
                    overlay.height = video.videoHeight;
                }
                try {
                    const now = performance.now();
                    const result = poseLandmarker.detectForVideo(video, now);
                    // 每滿一秒，更新一次每秒偵測次數
                    fpsCount++;
                    if (now - fpsStart >= 1000) {
                        fps = Math.round(fpsCount * 1000 / (now - fpsStart));
                        fpsCount = 0;
                        fpsStart = now;
                        updatePerfInfo();
                    }
                    ctx.clearRect(0, 0, overlay.width, overlay.height);
                    if (result.landmarks.length > 0) {
                        // landmarks[0] 就是 33 個關鍵點，每點有 x、y、z（0～1 的比例座標）
                        const landmarks = result.landmarks[0];
                        drawingUtils.drawConnectors(landmarks, vision.PoseLandmarker.POSE_CONNECTIONS,
                            { color: '#00FF00', lineWidth: 4 });
                        drawingUtils.drawLandmarks(landmarks, { color: '#FF0000', radius: 4 });
                        // 自己算出的點用藍色表示，並畫出軀幹線（肩膀中心 → 髖部中心）
                        const derived = getDerivedPoints(landmarks);
                        const trunk = [derived.SHOULDER_CENTER, derived.HIP_CENTER];
                        drawingUtils.drawConnectors(trunk, [{ start: 0, end: 1 }], { color: '#1E90FF', lineWidth: 4 });
                        drawingUtils.drawLandmarks(trunk, { color: '#1E90FF', radius: 6 });
                        if (showLabels) drawLabels(landmarks, derived);
                        poseStatus.textContent = '已偵測到人體';
                    } else {
                        poseStatus.textContent = '未偵測到人體，請站進畫面';
                    }
                } catch (err) {
                    console.error(err);
                    poseStatus.textContent = '骨架偵測發生錯誤';
                }
            }
            animationId = requestAnimationFrame(detectPose);
        }

        // 開啟鏡頭；沒指定 deviceId 時使用裝置預設鏡頭
        async function startCamera(deviceId) {
            stopStream();
            const constraints = {
                video: deviceId ? { deviceId: { exact: deviceId } } : true,
                audio: false
            };
            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                statusText.textContent = '鏡頭已開啟';
                stage.hidden = false;
                // 手機後鏡頭拍的是別人，不需要鏡像；前鏡頭與電腦鏡頭預設鏡像
                const facing = currentStream.getVideoTracks()[0].getSettings().facingMode;
                video.classList.toggle('mirrored', facing !== 'environment');
                overlay.classList.toggle('mirrored', facing !== 'environment');
                detectPose();
                updatePerfInfo();
                // 取得權限後才看得到鏡頭名稱，所以開啟後再列出清單
                await listCameras();
            } catch (err) {
                closeCamera();
                statusText.textContent = '無法開啟鏡頭：' + err.name + '（' + err.message + '）';
            }
        }

        // 只停止鏡頭串流（切換鏡頭時使用，畫面維持全螢幕）
        function stopStream() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            video.srcObject = null;
            cancelAnimationFrame(animationId);
            fpsCount = 0;
            fpsStart = performance.now();
            fps = 0;
            ctx.clearRect(0, 0, overlay.width, overlay.height);
            lastVideoTime = -1;
        }

        // 關閉鏡頭並回到首頁
        function closeCamera() {
            stopStream();
            if (document.fullscreenElement) document.exitFullscreen();
            stage.hidden = true;
            statusText.textContent = '鏡頭已關閉';
        }

        // 列出所有可用鏡頭（手機前後鏡頭、筆電內建、外接 USB 鏡頭等）
        async function listCameras() {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const cameras = devices.filter(d => d.kind === 'videoinput');
            const activeId = currentStream
                ? currentStream.getVideoTracks()[0].getSettings().deviceId
                : '';

            cameraSelect.innerHTML = '';
            cameras.forEach((camera, i) => {
                const option = document.createElement('option');
                option.value = camera.deviceId;
                option.textContent = camera.label || '鏡頭 ' + (i + 1);
                if (camera.deviceId === activeId) option.selected = true;
                cameraSelect.appendChild(option);
            });
        }

        // 全螢幕會連瀏覽器網址列一起隱藏；瀏覽器規定必須由使用者按鈕觸發
        function toggleFullscreen() {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                stage.requestFullscreen();
            }
        }

        startBtn.addEventListener('click', () => startCamera(cameraSelect.value));
        stopBtn.addEventListener('click', closeCamera);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        perfBtn.addEventListener('click', () => {
            perfExpanded = !perfExpanded;
            updatePerfInfo();
        });
        labelBtn.addEventListener('click', () => {
            showLabels = !showLabels;
            updateLabelBtn();
        });
        function updateLabelBtn() {
            labelBtn.textContent = showLabels ? '隱藏編號' : '顯示編號';
        }
        updateLabelBtn();

        cameraSelect.addEventListener('change', () => startCamera(cameraSelect.value));
        document.addEventListener('fullscreenchange', () => {
            fullscreenBtn.textContent = document.fullscreenElement ? '離開全螢幕' : '全螢幕';
        });

        // iPhone 等不支援網頁全螢幕的裝置，隱藏全螢幕按鈕（畫面仍會佔滿視窗）
        if (!document.fullscreenEnabled) {
            fullscreenBtn.hidden = true;
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            statusText.textContent = '此瀏覽器不支援鏡頭功能，請改用新版 Chrome、Safari 或 Edge';
            startBtn.disabled = true;
        }

        // 網頁一打開就在背景載入骨架模型，按下開啟鏡頭時通常已經準備好
        loadPoseModel();
    </script>
</body>
</html>
