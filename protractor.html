<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="在照片上拖三個點量關節角度，和 AI 在同一張照片上算的比">
    <meta name="theme-color" content="#0B1220">
    <title>照片量角器 · AI 智慧運動分析系統</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B1220'/%3E%3Cg stroke='%232EE6A6' stroke-width='2.6' stroke-linecap='round' fill='none'%3E%3Ccircle cx='16' cy='7.5' r='2.6'/%3E%3Cpath d='M16 11v8M9 14l7-2 7 2M16 19l-5 7M16 19l5 7'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/replay.css">
    <link rel="stylesheet" href="css/protractor.css">
</head>
<body>
    <nav class="site-nav" aria-label="網站導覽">
        <a class="nav-brand" href="./" aria-label="AI 運動分析（首頁）">
            <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
                <rect width="32" height="32" rx="9"/>
                <g><circle cx="16" cy="7.5" r="2.6"/><path d="M16 11v8M9 14l7-2 7 2M16 19l-5 7M16 19l5 7"/></g>
            </svg>
            <span class="nav-name">AI 運動分析</span>
        </a>
        <div class="nav-links">
            <a href="./">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg>首頁
            </a>
            <a href="replay.html">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 15l4-5 3 3 5-7"/></svg>重播分析
            </a>
            <a href="help.html" aria-current="page">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/></svg>使用說明
            </a>
        </div>
    </nav>

    <!-- 照片量角器（10/22，js/pages/protractor.js）：使用說明「驗證實驗 A」的另一種量法，導覽列標在「使用說明」 -->
    <main class="page replay protractor">
        <header class="replay-head">
            <h1>照片量角器</h1>
            <p class="intro">拍一張<strong>側面</strong>的照片（或鏡頭畫面的截圖），在照片上把三個圈拖到關節的中心，網站算出角度，和 <strong>AI 在同一張照片上算的</strong>比。拍完再量，現場不用另一個人拿量角器。照片只在這個瀏覽器裡處理，不會上傳。</p>
            <p class="back-link"><a href="help.html#experiments">← 回使用說明「驗證實驗」（全部的統計、下載 CSV）</a></p>
        </header>

        <section class="card" aria-labelledby="photoTitle">
            <h2 id="photoTitle">1. 選照片</h2>
            <label class="drop" id="drop">
                <input type="file" id="photoInput" accept="image/*">
                <span class="drop-main">選照片（或拍一張）</span>
                <span class="drop-sub">側面拍、整個人在照片裡；JPG、PNG 都可以，也可以拖到這裡</span>
            </label>
            <p id="photoStatus" class="load-status" role="status" aria-live="polite"></p>
        </section>

        <section class="card" id="measureCard" aria-labelledby="measureTitle" hidden>
            <h2 id="measureTitle">2. 對準關節</h2>
            <fieldset class="joint-pick" id="jointPick">
                <legend>量哪個關節</legend>
            </fieldset>
            <p class="note" id="measureHint">把三個圈拖到關節的中心（例如膝蓋：髖→膝→踝）。點一下圈可以用方向鍵微調，按住 Shift 一次移 10 格。</p>
            <!-- 照片、連線、三個可以拖的圈疊在一起；圈是按鈕，鍵盤也能移 -->
            <div class="photo-stage" id="photoStage">
                <canvas id="photo" role="img" aria-label="選的照片"></canvas>
                <svg id="lines" class="photo-lines" aria-hidden="true"></svg>
                <button type="button" class="handle" data-i="0"></button>
                <button type="button" class="handle joint" data-i="1"></button>
                <button type="button" class="handle" data-i="2"></button>
            </div>
            <div class="readout" aria-live="polite">
                <p><span>你量的</span><strong id="mine">—</strong></p>
                <p><span>AI 算的</span><strong id="ai">—</strong></p>
                <p><span>差距（AI－你量的）</span><strong id="diff">—</strong></p>
            </div>
            <div class="protractor-actions">
                <button id="saveBtn" type="button" class="primary-btn">記下這一筆（加到驗證實驗 A）</button>
                <button id="resetBtn" type="button">放回 AI 找到的位置</button>
            </div>
            <p id="saveStatus" class="load-status" role="status" aria-live="polite"></p>
        </section>
    </main>

    <script type="module" src="js/pages/protractor.js"></script>
    <script nomodule>
        document.getElementById('photoStatus').textContent = '此瀏覽器版本太舊，請改用新版 Chrome、Safari 或 Edge';
    </script>
</body>
</html>
