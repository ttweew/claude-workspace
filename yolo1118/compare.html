<!doctype html><meta charset="utf-8"><title>compare</title>
<style>body{margin:0;background:#1d1f21;font:22px "Noto Sans TC",sans-serif;color:#eee} .row{display:flex;gap:12px;padding:12px} figure{margin:0} figcaption{padding:8px 4px}</style>
<div class="row"><figure><canvas id="mp"></canvas><figcaption id="mpc"></figcaption></figure><figure><canvas id="yo"></canvas><figcaption id="yoc"></figcaption></figure></div>
<script type="module">
// 同一張照片：左邊 MediaPipe（33 點，有腳跟、腳尖），右邊 YOLO26n-pose（17 點）；腳的部分放大圈起來
const img = new Image(); img.src = 'pose.jpg'; await img.decode();
const W = 700, k = W / img.naturalWidth, H = Math.round(img.naturalHeight * k);
function base(id) { const c = document.getElementById(id); c.width = W; c.height = H; const g = c.getContext('2d'); g.drawImage(img, 0, 0, W, H); return g; }
function draw(g, pts, lines, color) {
  g.lineWidth = 3; g.strokeStyle = color;
  for (const [a, b] of lines) { if (!pts[a] || !pts[b]) continue; g.beginPath(); g.moveTo(pts[a][0] * k, pts[a][1] * k); g.lineTo(pts[b][0] * k, pts[b][1] * k); g.stroke(); }
  g.fillStyle = '#FFB547'; for (const p of pts) if (p) { g.beginPath(); g.arc(p[0] * k, p[1] * k, 4, 0, 7); g.fill(); }
}
// MediaPipe
const vision = await import('./mp/node_modules/@mediapipe/tasks-vision/vision_bundle.mjs');
const fileset = await vision.FilesetResolver.forVisionTasks('./mp/node_modules/@mediapipe/tasks-vision/wasm');
const lm = await vision.PoseLandmarker.createFromOptions(fileset, { baseOptions: { modelAssetPath: './mp/pose_landmarker_lite.task', delegate: 'CPU' }, runningMode: 'IMAGE', numPoses: 1 });
const r = lm.detect(img);
const mp = r.landmarks[0].map(p => [p.x * img.naturalWidth, p.y * img.naturalHeight]);
const MPL = [[11,13],[13,15],[12,14],[14,16],[11,12],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[27,29],[29,31],[27,31],[28,30],[30,32],[28,32]];
const g1 = base('mp'); draw(g1, mp, MPL, '#3DC98A');
// 腳跟（29、30）、腳尖（31、32）特別標紅圈
g1.strokeStyle = '#FF5A5A'; g1.lineWidth = 3;
for (const i of [29, 30, 31, 32]) { g1.beginPath(); g1.arc(mp[i][0] * k, mp[i][1] * k, 10, 0, 7); g1.stroke(); }
document.getElementById('mpc').textContent = 'MediaPipe lite：33 點（紅圈＝腳跟、腳尖）';
// YOLO
const ort = await import('./web/node_modules/onnxruntime-web/dist/ort.min.mjs');
ort.env.wasm.wasmPaths = new URL('./web/node_modules/onnxruntime-web/dist/', location.href).href; ort.env.wasm.numThreads = 1;
const size = 320, session = await ort.InferenceSession.create('weights/yolo26n-pose-320.onnx', { executionProviders: ['wasm'] });
const scale = Math.min(size / img.naturalWidth, size / img.naturalHeight), w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
const padX = (size - w) / 2, padY = (size - h) / 2, cv = new OffscreenCanvas(size, size), cg = cv.getContext('2d');
cg.fillStyle = 'rgb(114,114,114)'; cg.fillRect(0, 0, size, size); cg.drawImage(img, padX, padY, w, h);
const px = cg.getImageData(0, 0, size, size).data, n = size * size, data = new Float32Array(3 * n);
for (let i = 0; i < n; i++) { data[i] = px[i * 4] / 255; data[n + i] = px[i * 4 + 1] / 255; data[2 * n + i] = px[i * 4 + 2] / 255; }
const res = await session.run({ [session.inputNames[0]]: new ort.Tensor('float32', data, [1, 3, size, size]) });
const o = res[session.outputNames[0]], [, rows, cols] = o.dims, d = o.data;
let best = 0; for (let i = 1; i < rows; i++) if (d[i * cols + 4] > d[best * cols + 4]) best = i;
const yo = []; for (let j = 0; j < 17; j++) { const b = best * cols + 6 + j * 3; yo.push([(d[b] - padX) / scale, (d[b + 1] - padY) / scale]); }
const YL = [[5,7],[7,9],[6,8],[8,10],[5,6],[5,11],[6,12],[11,12],[11,13],[13,15],[12,14],[14,16]];
const g2 = base('yo'); draw(g2, yo, YL, '#3DC98A');
document.getElementById('yoc').textContent = 'YOLO26n-pose（輸入 320）：17 點，到腳踝為止';
window.__done = true;
</script>
