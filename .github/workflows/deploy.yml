# 每次推送到 main 分支，就自動把網站發布到 GitHub Pages
name: Deploy to GitHub Pages
 
on:
  push:
    branches: [main]
  workflow_dispatch:   # 也可以在 Actions 頁面手動按「Run workflow」
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: pages
  cancel-in-progress: true
 
# 分成兩段：build 準備網站、上傳；deploy 等 build 做完才發布（GitHub 官方範本的另一種寫法）
# 為什麼：以前同一段裡上傳完 0.3 秒就發布，11/24、11/25 連續好幾次發布時找不到剛上傳的檔案
#   （記錄寫「上傳成功」，下一步卻「Found 0 artifact(s)」：GitHub 還沒登記好）；分兩段之後，發布要等 build 整段結束、
#   新的一段開起來才開始，中間有好幾秒，上傳的檔案已經登記好了
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 在每個 CSS、JS 檔名後面加上這次的版本號（commit 編號前 8 碼），例如 js/pages/main.js?v=1a2b3c4d
      # 瀏覽器會把不同版本當成不同檔案，就不會發生「新版 main.js 配舊版 labels.js」而出錯
      # 只改發布出去的檔案，不影響 GitHub 上的原始碼
      - name: Add version to file links
        run: |
          v="${GITHUB_SHA::8}"
          # 最上層的每一頁（*.html）都加：以前只寫了 index、replay、help 三頁，10/21 新增的實測報表（report.html）沒加到
          sed -i "s#href=\"css/\([a-z-]*\)\.css\"#href=\"css/\1.css?v=$v\"#g; s#src=\"js/\([a-z/-]*\)\.js\"#src=\"js/\1.js?v=$v\"#g" *.html
          # js 分在幾個子資料夾裡：每個檔案的 import（./x.js、../skeleton/x.js）都加上版本號
          find js -name '*.js' -exec sed -i -E "s#(from '\.{1,2}/[A-Za-z/.-]*\.js)'#\1?v=$v'#g" {} +
          grep -c "?v=$v" *.html $(find js -name '*.js' | sort)
          # 安全檢查：每一頁的 CSS、JS 連結都要加到版本號
          if grep -nE 'href="css/[^"?]*\.css"|src="js/[^"?]*\.js"' *.html; then echo "有頁面的連結沒加到版本號"; exit 1; fi
          # 安全檢查：還有沒加到版本號的 import 就停止發布（手機可能拿到新舊混在一起的檔案）
          if grep -rnE "from '\.{1,2}/[^'?]*\.js'" js; then echo "有 import 沒加到版本號"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
