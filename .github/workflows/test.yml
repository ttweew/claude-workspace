# 每次推送、每個 PR 都自動跑一次測試（tests/ 資料夾），結果顯示在 GitHub 的 Actions 頁面和 PR 上
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 不需要安裝任何套件：測試只用 Node.js 內建的測試工具
      - run: npm test
