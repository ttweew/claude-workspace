# 每次推送、每個 PR 都自動跑一次測試（tests/ 資料夾），結果顯示在 GitHub 的 Actions 頁面和 PR 上
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 不需要安裝任何套件：測試只用 Node.js 內建的測試工具
      - run: npm test

  # 雲端的安全規則（firestore.rules）：在 Firebase 的本機模擬器上跑 tests/rules/（docs/firebase-setup.md）
  # firebase-tools 只在這裡臨時下載，專案本身還是不用安裝套件；模擬器要 Java
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # 模擬器的程式（約 140 MB）存起來，下次不用重新下載
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.34.1
      - run: npx --yes firebase-tools@15.34.1 emulators:exec --only firestore --project demo-sport "npm run test:rules"

  # 瀏覽器端到端測試（tests/browser/，10/30）：真的 Chromium 打開網站，鏡頭、AI 換成假的（合成資料，不用連 MediaPipe）
  # Playwright、axe-core 只在這裡臨時下載，專案本身還是不用安裝套件
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.63.0 axe-core@4.10.3
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
