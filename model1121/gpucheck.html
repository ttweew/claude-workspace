<!doctype html><meta charset="utf-8"><title>gpu check</title>
<script type="module">
import * as core from './vendor/litertjs/litert-core.js';
import * as yc from './js/ai/yolo-core.js';
const out = window.__out = {};
try {
  self.Module = { locateFile: p => 'https://cdn.jsdelivr.net/npm/@litertjs/core@2.6.0/wasm/' + p };
  await core.loadLiteRt('https://cdn.jsdelivr.net/npm/@litertjs/core@2.6.0/wasm/litert_wasm_internal.js');
  const im = new Image(); im.src = '/__test/pu_030.png'; await im.decode();
  const S = 320, c = new OffscreenCanvas(S, S), g = c.getContext('2d');
  const fit = yc.letterbox(im.width, im.height, S);
  g.fillStyle = 'rgb(114,114,114)'; g.fillRect(0, 0, S, S); g.drawImage(im, 0, 0, im.width, im.height, fit.padX, fit.padY, fit.w, fit.h);
  const input = yc.toInput(g.getImageData(0, 0, S, S).data, S);
  const bytes = new Uint8Array(await (await fetch('models/yolo/yolo26n-pose-320.tflite')).arrayBuffer());
  const res = {};
  for (const acc of ['wasm', 'webgpu']) {
    const m = await core.loadAndCompile(bytes, { accelerator: acc });
    const t = new core.Tensor(input, [1, 3, S, S]);
    const o = await m.run(t);
    const d = await o[0].data();
    res[acc] = yc.decodeBest(d, { rx: 0, ry: 0, rw: im.width, rh: im.height }, fit, im.width, im.height, S);
    t.delete(); for (const x of o) x.delete(); m.delete();
  }
  let maxPx = 0;
  res.wasm.k.forEach(([x, y], j) => { const [x2, y2] = res.webgpu.k[j]; maxPx = Math.max(maxPx, Math.abs(x - x2) * im.width, Math.abs(y - y2) * im.height); });
  out.score = [res.wasm.score, res.webgpu.score];
  out.maxPx = maxPx;
  out.done = true;
} catch (e) { out.error = String(e && e.stack || e); out.done = true; }
</script>
